[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-medical-chatbot"
version = "1.0.0"
description = "Production RAG-based Medical Chatbot with LangChain, FAISS, and Groq"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Adith Babu" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
